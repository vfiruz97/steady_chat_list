name: steady_chat_list_drift
description: >-
  Drift (SQLite) message cache for steady_chat_list: chats open at once and
  work offline. Works on mobile, desktop and web.
version: 0.1.3
repository: https://github.com/vfiruz97/steady_chat_list/tree/main/packages/steady_chat_list_drift
issue_tracker: https://github.com/vfiruz97/steady_chat_list/issues
topics:
  - chat
  - cache
  - sqlite

environment:
  sdk: ^3.5.0

dependencies:
  drift: ^2.20.0
  steady_chat_list_core: ^0.1.3

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0
