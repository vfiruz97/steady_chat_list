name: steady_chat_list
description: >-
  A Telegram-grade chat message list: opens at the right place, pages
  unlimited history with a fixed number of widgets, and never jumps.
version: 0.1.0-dev.8
repository: https://github.com/vfiruz97/steady_chat_list/tree/main/packages/steady_chat_list
issue_tracker: https://github.com/vfiruz97/steady_chat_list/issues
topics:
  - chat
  - list
  - scroll
  - pagination

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ^2.2.0
  steady_chat_list_core: ^0.1.0-dev.8

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
