name: steady_chat_list
description: >-
  A steady chat message list: opens at the right place, pages
  unlimited history with a fixed number of widgets, and never jumps.
version: 0.1.7
repository: https://github.com/vfiruz97/steady_chat_list/tree/main/packages/steady_chat_list
issue_tracker: https://github.com/vfiruz97/steady_chat_list/issues
screenshots:
  - description: Scrolling and jumping through a chat of 10,000,000 messages.
    path: screenshots/scrolling.gif
  - description: The example app with the 10,000,000 messages demo open.
    path: screenshots/chat.png
topics:
  - chat
  - list
  - scroll
  - pagination

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ">=0.19.0 <0.21.0"
  shared_preferences: ^2.2.0
  steady_chat_list_core: ^0.1.7

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
