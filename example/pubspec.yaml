name: steady_chat_list_example
description: Showcase of everything steady_chat_list can do, on a simulated server.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  steady_chat_list:
    path: ../packages/steady_chat_list
  steady_chat_list_drift:
    path: ../packages/steady_chat_list_drift

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

dependency_overrides:
  steady_chat_list_core:
    path: ../packages/steady_chat_list_core

flutter:
  uses-material-design: true
