name: steady_chat_list_benchmarks
description: Host app for the integration and performance tests of steady_chat_list.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  steady_chat_list:
    path: ../packages/steady_chat_list

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ">=4.0.0 <7.0.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

dependency_overrides:
  steady_chat_list_core:
    path: ../packages/steady_chat_list_core

flutter:
  uses-material-design: false
